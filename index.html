<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Tower of Hanoi - Touch Optimized</title>
    <style>
        :root {
            --bg-color: #ECEFF1;
            --peg-color: #795548;
            --base-color: #4E342E;
            --text-main: #37474F;
            --text-sub: #546E7A;
            --accent-blue: #2196F3;
            --accent-teal: #00897B;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: -webkit-fill-available; /* Corrects dynamic viewport clipping on iOS Safari */
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden; /* Prevents rubber-band scroll bouncing on iOS */
        }

        html {
            height: -webkit-fill-available;
        }

        .game-container {
            width: 100%;
            max-width: 800px;
            height: 100%;
            max-height: 550px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding: 10px;
            box-sizing: border-box;
        }

        /* Typography Headers */
        h1 { font-size: 24px; margin: 5px 0; color: var(--text-main); font-weight: bold; text-align: center; }
        .instructions { font-size: 13px; color: var(--text-sub); text-align: center; margin: 2px 0; line-height: 1.4; }
        
        .counter-status {
            font-size: 16px;
            font-weight: bold;
            color: var(--accent-blue);
            margin: 10px 0;
            height: 20px;
        }

        /* Interactive Canvas Area */
        #gameCanvas {
            background-color: var(--bg-color);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            max-width: 100%;
            touch-action: none; /* Crucial: stops iOS Safari gestures from taking over taps */
        }

        /* Interface Control Buttons */
        .button-row {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }

        .btn {
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            padding: 10px 22px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            transition: background-color 0.2s, opacity 0.2s;
            -webkit-appearance: none; /* Strips iOS default glass/pill button layout styles */
        }
        .btn-start { background-color: var(--accent-blue); }
        .btn-start:disabled { background-color: #b0bec5; cursor: not-allowed; box-shadow: none; }
        .btn-reset { background-color: var(--accent-teal); }
        .btn-reset:disabled { background-color: #b0bec5; cursor: not-allowed; box-shadow: none; }

        /* Modal Layout */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(55, 71, 79, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 8px;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 6px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            max-width: 80%;
        }
        .modal-title { font-size: 20px; font-weight: bold; margin-bottom: 12px; color: var(--text-main); }
        .modal-msg { font-size: 15px; margin-bottom: 20px; color: var(--text-sub); line-height: 1.5; }
        .modal-btn { background-color: var(--accent-blue); color: white; padding: 8px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; -webkit-appearance: none;}
    </style>
</head>
<body>

<div class="game-container">
    <h1>Tower of Hanoi</h1>
    <div class="instructions">Tap a peg to select its top disk, then tap another peg to move it.</div>
    <div class="instructions"><strong>Rules:</strong> Move one block at a time. Bigger blocks CANNOT rest on smaller blocks.</div>
    
    <div id="counterStatus" class="counter-status">Press 'Start Game' to Begin!</div>

    <canvas id="gameCanvas" width="800" height="340"></canvas>

    <div class="button-row">
        <button id="startBtn" class="btn btn-start" onclick="startGame()">Start Game</button>
        <button id="resetBtn" class="btn btn-reset" onclick="resetGame()" disabled>Restart</button>
    </div>

    <div id="victoryModal" class="modal">
        <div class="modal-content">
            <div class="modal-title">🏆 Victory!</div>
            <div class="modal-msg" id="modalMsg">Completion matrix breakdown summaries.</div>
            <button class="modal-btn" onclick="closeModal()">OK</button>
        </div>
    </div>
</div>

<script>
    // System Configurations
    const NUM_DISKS = 3;
    const PEG_X = [200, 400, 600];
    const PEG_Y_BASE = 300;
    const PEG_HEIGHT = 220;
    const DISK_HEIGHT = 25;
    const DISK_COLORS = ["#E53935", "#FB8C00", "#FDD835", "#43A047", "#1E88E5", "#3949AB"];

    // Application State Contexts
    let pegsState = [[], [], []];
    let movesCount = 0;
    let gameActive = false;
    let startTime = 0;
    let selectedPeg = null; // Holds index (0, 1, 2) of active choice selection

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const counterStatus = document.getElementById('counterStatus');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');

    // Canvas Initial Draw State Layout Setup
    drawScene();

    function startGame() {
        gameActive = true;
        startTime = performance.now();
        movesCount = 0;
        selectedPeg = null;
        pegsState = [Array.from({length: NUM_DISKS}, (_, i) => NUM_DISKS - 1 - i), [], []];
        
        startBtn.disabled = true;
        resetBtn.disabled = false;
        updateStatus();
        drawScene();
    }

    function resetGame() {
        startGame();
    }

    function updateStatus() {
        counterStatus.style.color = "var(--accent-blue)";
        counterStatus.textContent = `Moves Made: ${movesCount}`;
    }

    function drawScene() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Structural Platform Base Foundation Line
        ctx.fillStyle = "#4E342E";
        ctx.fillRect(100, PEG_Y_BASE, 600, 20);

        // 2. Vertical Rod Core Bars
        ctx.fillStyle = "#795548";
        for (let i = 0; i < PEG_X.length; i++) {
            const x = PEG_X[i];
            ctx.fillRect(x - 8, PEG_Y_BASE - PEG_HEIGHT, 16, PEG_HEIGHT);

            // Give visual feedback indicator highlight if rod source is active selection
            if (selectedPeg === i) {
                ctx.strokeStyle = "#2196F3";
                ctx.lineWidth = 3;
                ctx.strokeRect(x - 12, PEG_Y_BASE - PEG_HEIGHT - 4, 24, PEG_HEIGHT + 8);
            }
        }

        // 3. Sequential Disks Node Stack Render Layout
        if (gameActive) {
            for (let pegIdx = 0; pegIdx < pegsState.length; pegIdx++) {
                const disks = pegsState[pegIdx];
                for (let diskPos = 0; diskPos < disks.length; diskPos++) {
                    const diskSize = disks[diskPos];
                    drawDisk(pegIdx, diskPos, diskSize);
                }
            }
        }
    }

    function drawDisk(pegIdx, diskPos, diskSize) {
        const width = 50 + (diskSize * 45);
        const xCenter = PEG_X[pegIdx];
        const yBottom = PEG_Y_BASE - (diskPos * DISK_HEIGHT);

        const x = xCenter - (width / 2);
        const y = yBottom - DISK_HEIGHT;

        ctx.fillStyle = DISK_COLORS[diskSize % DISK_COLORS.length];
        ctx.fillRect(x, y, width, DISK_HEIGHT);

        ctx.strokeStyle = "#212121";
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, width, DISK_HEIGHT);
    }

    // Unified Pointer Event listener replaces buggy touch/click bindings
    canvas.addEventListener('pointerdown', handleInteraction);

    function handleInteraction(e) {
        if (!gameActive) return;

        // Prevent double-touch registration and native scrolling interference
        e.preventDefault();

        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const clickX = (e.clientX - rect.left) * scaleX;

        // Resolve which vertical peg column zone was closest to target tap
        let targetPeg = null;
        let minDistance = Infinity;

        for (let i = 0; i < PEG_X.length; i++) {
            const dist = Math.abs(clickX - PEG_X[i]);
            if (dist < minDistance && dist < 100) { 
                minDistance = dist;
                targetPeg = i;
            }
        }

        if (targetPeg !== null) {
            processPegSelection(targetPeg);
        }
    }

    function processPegSelection(pegIdx) {
        if (selectedPeg === null) {
            // Source Choice Step: check if selected peg has blocks to move
            if (pegsState[pegIdx].length > 0) {
                selectedPeg = pegIdx;
                drawScene(); // Forces render updating to highlight active selection ring
            }
        } else {
            // Destination Choice Step
            const srcPeg = selectedPeg;
            const destPeg = pegIdx;
            selectedPeg = null; // De-select indicator path variables cleanly

            if (srcPeg !== destPeg) {
                const srcDisks = pegsState[srcPeg];
                const destDisks = pegsState[destPeg];
                
                const movingDisk = srcDisks[srcDisks.length - 1];
                const topDestDisk = destDisks[destDisks.length - 1];

                // Standard Rules Validation
                if (destDisks.length === 0 || movingDisk < topDestDisk) {
                    destDisks.push(srcDisks.pop());
                    movesCount++;
                    updateStatus();
                    
                    // Evaluate global endgame target metrics (All items landed on column index 2)
                    if (pegsState[2].length === NUM_DISKS) {
                        const elapsed = ((performance.now() - startTime) / 1000).toFixed(1);
                        gameActive = false;
                        startBtn.disabled = false;
                        
                        document.getElementById('modalMsg').innerHTML = 
                            `Congratulations! You solved it in <strong>${movesCount}</strong> moves!<br>` +
                            `Time taken: <strong>${elapsed}</strong> seconds.<br><br>` +
                            `<em>Note: 7 moves is the absolute mathematical minimum!</em>`;
                        document.getElementById('victoryModal').style.display = 'flex';
                    }
                }
            }
            drawScene();
        }
    }

    function closeModal() {
        document.getElementById('victoryModal').style.display = 'none';
        counterStatus.textContent = "Press 'Start Game' to Begin!";
    }
</script>

</body>
</html>
